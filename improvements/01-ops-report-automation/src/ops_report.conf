# =====================================================================
# ops_report.conf
# 改善案件No.1: 月次運用報告書の自動生成 - 設定ファイル
#
# このファイルを編集することで、ops_report.sh 本体のロジックを
# 変更せずに動作を変えられる。「設定(config)」と「処理(script)」を
# 分離しておくと、運用担当者が値を変えるだけで対応でき、
# 誤ってロジックを壊してしまうリスクを減らせる
# (構築パックの案件No.2 / No.4 と同じ設計方針)。
#
# 注意: このファイルには Slack Webhook の URL(秘匿情報)を書くため、
#       配置後は必ず `chmod 600 ops_report.conf` で権限を絞ること。
#
# 【文法メモ】
#   このファイルは ops_report.sh から `source`(=中身をその場で
#   読み込んで実行する命令)されるため、書式はシェルスクリプトと同じ。
#   「変数名=値」の = の前後に空白を入れるとエラーになる点に注意。
# =====================================================================

# ---------------------------------------------------------------
# 1. レポートに載せる組織情報
# ---------------------------------------------------------------
# ※ 株式会社サンプル商事は「架空の依頼元」。実在の企業ではない。
COMPANY_NAME="株式会社サンプル商事"
REPORT_AUTHOR="情報システム課 運用担当"

# ---------------------------------------------------------------
# 2. 入力ログの場所
# ---------------------------------------------------------------

# --- バックアップログの置き場所(案件No.2 backup.sh が出力したログ) ---
# 「サーバーごとのサブディレクトリ」を持つ親ディレクトリを指定する。
#   例)
#     /var/log/ops-report/collected/
#       ├── web01/backup.log
#       ├── web02/backup.log
#       └── ...
# サブディレクトリ名がそのままレポート上のサーバー名になる。
BACKUP_LOG_ROOT="/var/log/ops-report/collected"

# --- 各サーバーディレクトリ内のバックアップログのファイル名 ---
BACKUP_LOG_NAME="backup.log"

# --- 死活監視の履歴CSV(案件No.4 health_check.sh が出力する history.csv) ---
# 全サーバー分が1ファイルにまとまっている。
# 書式: timestamp,name,type,target,status
HEALTH_HISTORY_FILE="/var/log/server-health-check/history.csv"

# --- 死活監視の実行ログ(障害イベントの抽出に使う) ---
HEALTH_LOG_FILE="/var/log/server-health-check/health_check.log"

# ---------------------------------------------------------------
# 3. 出力先
# ---------------------------------------------------------------

# --- 生成したレポートの保存先ディレクトリ ---
# ファイル名は ops-report-YYYY-MM.md のように自動で決まる。
REPORT_DIR="/opt/ops-report/reports"

# --- このツール自身の実行ログ ---
LOG_FILE="/var/log/ops-report/ops_report.log"

# ---------------------------------------------------------------
# 4. 判定に使うしきい値・目標値
# ---------------------------------------------------------------

# --- 1日あたり期待されるバックアップ実行回数 ---
# 案件No.2 は「毎日AM3:00に1回」なので 1。
# 実施率(= 実行回数 ÷ 期待回数)の計算に使う。
BACKUP_EXPECTED_PER_DAY=1

# --- 稼働率の目標値(%)。この値以上なら「達成」と判定する ---
UPTIME_TARGET=99.5

# --- バックアップ成功率の目標値(%) ---
BACKUP_SUCCESS_TARGET=100

# --- ディスク使用率の警告しきい値(%) ---
# 月内の最大使用率がこの値以上のサーバーにはレポート上で警告マークを付ける。
# 案件No.2 の backup.conf の DISK_USAGE_THRESHOLD と同じ値にしておく。
DISK_USAGE_THRESHOLD=80

# ---------------------------------------------------------------
# 5. HTML版レポートの生成
# ---------------------------------------------------------------
# true にすると、Markdown版と同じ内容の HTML 版も出力する
# (Markdownを読めない人へメールで送りたい場合などに使う)。
# 変換には同ディレクトリの md2html.sh を使う。
ENABLE_HTML_REPORT=false

# ---------------------------------------------------------------
# 6. Slack通知
# ---------------------------------------------------------------

# --- Slack通知を有効にするか(true/false) ---
ENABLE_SLACK_NOTIFY=false

# --- Slack Incoming WebhookのURL ---
# Slack側の「Appを追加」>「Incoming Webhooks」で発行したURLに書き換える。
# 未設定のまま ENABLE_SLACK_NOTIFY=true にすると通知はスキップされる。
SLACK_WEBHOOK_URL="<YOUR_SLACK_WEBHOOK_URL>"
