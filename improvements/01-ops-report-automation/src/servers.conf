# =====================================================================
# servers.conf
# 改善案件No.1: 月次運用報告書の自動生成 - ログ収集対象サーバー一覧
#
# collect_logs.sh が読み込む。サーバーが増減したときは
# このファイルだけを直せばよい(スクリプト本体は変更不要)。
#
# 書式(カンマ区切り、3項目):
#   name,ssh_target,remote_log_path
#
#   name            : レポート上のサーバー名。この名前のディレクトリが
#                     BACKUP_LOG_ROOT の下に作られる
#   ssh_target      : SSHの接続先。"ユーザー名@ホスト" 形式
#                     ("localhost" と書くと、SSHを使わずローカルの
#                      ファイルをコピーする = 検証環境向け)
#   remote_log_path : そのサーバー上のバックアップログの絶対パス
#
# "#" で始まる行と空行は読み飛ばされる。
# =====================================================================

# --- Webサーバー群 ---
web01,ops@192.168.1.11,/var/log/backup-automation/backup.log
web02,ops@192.168.1.12,/var/log/backup-automation/backup.log

# --- APIサーバー ---
api01,ops@192.168.1.13,/var/log/backup-automation/backup.log

# --- DB / アプリ / ファイルサーバー群 ---
db01,ops@192.168.1.21,/var/log/backup-automation/backup.log
app01,ops@192.168.1.22,/var/log/backup-automation/backup.log
file01,ops@192.168.1.23,/var/log/backup-automation/backup.log
