# =====================================================================
# jobs.conf
# 改善案件No.4: cronのサイレント障害を実行結果の可視化と失敗検知で撲滅
#   - ジョブ台帳(監視対象のcronジョブ一覧)
#
# このファイルが「サーバー上でどんな定期処理が動いているか」の台帳になる。
# デッドマン監視(= 起きるはずのことが起きていないことを検知する監視)と
# 日次レポートは、このファイルに書かれたジョブだけを対象にする。
#
# 【書式】1行につき1ジョブ、カンマ区切りで5項目
#   ジョブID,想定実行間隔(分),猶予時間(分),有効フラグ,説明
#
#   ジョブID       : 半角英数字・ハイフン・アンダースコアのみ。
#                    run_job.sh の第1引数に渡す名前と一致させること。
#   想定実行間隔   : 「正常なら、最大でも何分に1回は実行されるはずか」。
#                    毎日1回なら 1440(=24時間×60分)、5分ごとなら 5。
#   猶予時間       : 実行の遅れをどこまで許すか。
#                    「想定実行間隔+猶予時間」を過ぎても実行記録が無ければ
#                    「未実行(MISSING)」として通知する。
#   有効フラグ     : yes = 監視対象。no = 監視対象外(移行前・停止中)。
#                    ラッパー経由への移行が済んだジョブから yes にしていく。
#   説明           : レポートに表示される日本語の説明。
#
# 【注意】
#   - 説明以外の項目にスペースを入れないこと(前後のスペースは自動で除去される)
#   - 説明に「#」を含めないこと(そこから先はコメントとして無視される)
#
# 【間隔と猶予の決め方】
#   猶予時間は「そのジョブが普段どれくらいの時間で終わるか」＋
#   「気づくのが遅れて困らない範囲」で決める。短すぎると誤検知(まだ
#   走っている最中なのに未実行と判定)、長すぎると発見が遅れる。
#   詳しくは 03-design.md「ジョブ定義ファイルの仕様」を参照。
# =====================================================================

# ジョブID,想定実行間隔(分),猶予時間(分),有効フラグ,説明
backup-daily,1440,120,yes,Webコンテンツの日次バックアップ(projects/02-backup-automation)
health-check,5,10,yes,サーバー死活監視(projects/04-server-health-check)
db-dump,1440,120,yes,基幹DBの論理バックアップ(mysqldump)
user-sync,60,20,yes,人事CSVからのアカウント同期(projects/01-user-account-automation)
logrotate-app,1440,120,yes,アプリケーションログのローテート
tmp-cleanup,1440,120,yes,作業用一時ディレクトリの古いファイル削除
cert-expiry-check,10080,360,yes,SSLサーバー証明書の有効期限チェック(毎週月曜)
sales-csv-transfer,4320,60,yes,基幹システムへの売上CSV連携(平日のみ)

# --- 監視の仕組み自身のジョブ ---
# デッドマン監視とレポート生成もラッパー経由で動かし、台帳にも登録する。
# 「監視の仕組みが壊れていないか」も監視対象に含めるという考え方。
# ただし「デッドマン監視そのものが起動しなかった場合」は、
# 同じサーバーの中では原理的に検知できない(05-effect-measurement.mdの残課題を参照)。
deadman-check,10,10,yes,デッドマン監視(未実行検知)そのものの実行記録
daily-report,1440,120,yes,実行状況レポートの日次生成

