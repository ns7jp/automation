# =====================================================================
# logrotate-cron-job-observability.conf
# 改善案件No.4: cronのサイレント障害を実行結果の可視化と失敗検知で撲滅
#   - ログローテート設定
#
# 配置先:
#   /etc/logrotate.d/cron-job-observability
#   (ファイル名に拡張子 .conf は付けない。logrotateの慣習に合わせる)
#
# 目的:
#   実行記録CSVとジョブ別ログは、放置すると際限なく増え続ける。
#   検証環境での実測では、ジョブ10本の1日分の実行記録(461件)で
#   約39KB。1年で約14MBになる計算であり、容量そのものは大きくないが、
#   「1つのファイルが巨大になると、grepもawkも開くのが遅くなる」ため、
#   月単位で区切っておく。
#
# 動作確認:
#   sudo logrotate -d /etc/logrotate.d/cron-job-observability   # -d は確認のみ(実行しない)
#   sudo logrotate -f /etc/logrotate.d/cron-job-observability   # -f で強制実行
# =====================================================================

# --- 実行記録CSV ---
# 月1回ローテートし、12世代(=1年分)保存する。
# ローテート後の新しいCSVには見出し行が無い状態になるが、
# run_job.sh は「ファイルが無ければ見出し行を作る」実装のため、
# ローテートで元ファイルが移動された次の実行時に見出し行が再作成される。
/var/log/cron-job-observability/records.csv {
    monthly
    rotate 12
    missingok
    notifempty
    compress
    delaycompress
    create 0644 root root
}

# --- ジョブ別ログ・仕組み自身のログ ---
# ジョブの出力は量が読めないため、サイズ基準(10MB)でもローテートする。
# size と weekly を併記すると「週1回、ただし10MBを超えたらその時点で」になる。
/var/log/cron-job-observability/jobs/*.log
/var/log/cron-job-observability/runner.log
/var/log/cron-job-observability/wrapper-cron.log {
    weekly
    size 10M
    rotate 8
    missingok
    notifempty
    compress
    delaycompress
    create 0644 root root
}
