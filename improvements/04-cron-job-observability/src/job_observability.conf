# =====================================================================
# job_observability.conf
# 改善案件No.4: cronのサイレント障害を実行結果の可視化と失敗検知で撲滅
#   - 共通設定ファイル
#
# run_job.sh / deadman_check.sh / generate_report.sh の3本が
# 共通で読み込む設定ファイル。パスや通知先を変えたいときは、
# スクリプト本体ではなくこのファイルだけを編集する。
#
# 注意: Slack WebhookのURL(秘匿情報)を書き込むファイルのため、
#       配置後は必ず `chmod 600 job_observability.conf` で
#       アクセス権限を絞ること。
# =====================================================================

# --- スクリプト・ジョブ台帳の配置先 ---
# 3本のスクリプトと jobs.conf を置くディレクトリ
BASE_DIR="/opt/cron-job-observability"

# --- ジョブ台帳(監視対象のcronジョブ一覧)---
# 「どのジョブが、どれくらいの間隔で動くはずか」を定義したファイル。
# デッドマン監視(未実行検知)とレポート生成が、このファイルを基準にする。
JOBS_FILE="${BASE_DIR}/jobs.conf"

# --- 記録・ログの出力先 ---
LOG_BASE_DIR="/var/log/cron-job-observability"

# 実行記録CSV(全ジョブの実行結果が1行ずつ追記される中心的なファイル)
RECORD_FILE="${LOG_BASE_DIR}/records.csv"

# ジョブごとの標準出力・標準エラー出力の保存先ディレクトリ
# (ジョブID単位で <ジョブID>.log というファイルに追記される)
JOB_LOG_DIR="${LOG_BASE_DIR}/jobs"

# 日次レポート(Markdown)の出力先ディレクトリ
REPORT_DIR="${LOG_BASE_DIR}/reports"

# 監視の仕組み自身の動作ログ(ラッパーやデッドマン監視の内部動作の記録)
RUNNER_LOG="${LOG_BASE_DIR}/runner.log"

# --- 状態ファイルの置き場所 ---
# デッドマン監視が「このジョブは通知済み」という状態を覚えておくために使う。
# 再起動しても消えないよう /var/lib 配下に置く。
STATE_DIR="/var/lib/cron-job-observability"

# --- ロックファイルの置き場所 ---
# flock による多重起動防止に使う。/var/lock は再起動時にクリアされる領域
# (Ubuntuでは /run/lock へのシンボリックリンク)であり、
# 「電源断でロックファイルが残り続ける」事故を避けられるためここを使う。
LOCK_DIR="/var/lock/cron-job-observability"

# --- Slack通知を有効にするか(true/false)---
ENABLE_SLACK_NOTIFY=true

# --- Slack Incoming WebhookのURL ---
# Slack側の「Appを追加」>「Incoming Webhooks」で発行したURLに書き換える。
# 下のプレースホルダーのままの場合、スクリプトは通知の送信を試みず、
# 通知内容を RUNNER_LOG に書き出すだけの「ドライラン動作」になる。
# (設定前にうっかり実行してもエラーで止まらないようにするための安全策)
SLACK_WEBHOOK_URL="<YOUR_SLACK_WEBHOOK_URL>"

# --- Slack通知(curl)のタイムアウト秒数 ---
# 通知先が応答しないときに、ジョブの後始末がいつまでも終わらないのを防ぐ
CURL_TIMEOUT=10

# --- 失敗通知に添付する、ジョブログの末尾行数 ---
# 「何が起きたか」を通知だけで判断できるようにするための情報量。
# 多すぎるとSlackが読みにくくなるため10行程度が目安
NOTIFY_LOG_LINES=10

# --- 多重起動によるスキップが発生したときに通知するか(true/false)---
# スキップは「前回の実行がまだ終わっていない」という異常のサインなので、
# 既定では通知する。5分間隔ジョブなどで通知が多すぎる場合は false にする
NOTIFY_ON_SKIP=true
