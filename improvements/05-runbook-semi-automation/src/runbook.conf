# =====================================================================
# runbook.conf
# 改善案件No.5: 手順書ベースの障害対応の半自動化 - 共通設定ファイル
#
# diagnose.sh(診断)と recover.sh(半自動復旧)が共通で読み込む。
# 「設定(このファイル)」と「処理(スクリプト本体)」を分けておくと、
# 運用担当者はロジックを触らずに閾値や対象サービスだけを変更できる。
#
# 書式は Bash の変数定義そのもの(スクリプト内で source される)。
# そのため、このファイルを書き換えられる人は実質的にサーバー上で
# 任意のコマンドを実行できることになる。必ず root 所有・600 にすること。
#   sudo chown root:root runbook.conf && sudo chmod 600 runbook.conf
# =====================================================================

# ---------------------------------------------------------------------
# 1. 対象サービス
# ---------------------------------------------------------------------

# 監視・復旧の対象とするサービス名(systemd のユニット名)
WEB_SERVICE="nginx"

# systemctl が使えない環境(コンテナなど)でプロセスの生存を確認するときの
# プロセス名。pgrep -x に渡すため、完全一致する実行ファイル名を書く。
WEB_PROCESS="nginx"

# ヘルスチェック用URL(自ホストから見た正常性確認先)
# 外部からの経路ではなく「サーバー自身が応答を返せるか」を見るため 127.0.0.1 を使う。
HEALTH_URL="http://127.0.0.1/"

# LISTEN(接続待ち受け)しているはずのポート番号。スペース区切りで複数指定できる。
LISTEN_PORTS="80"

# 設定ファイルの構文チェックコマンド(配列で指定する)
#   空の配列 () にすると、このチェックは SKIP される。
#   配列にしている理由: 文字列にすると実行時に eval が必要になり、
#   設定ファイル経由で任意のコマンドが混入する危険が増すため。
SERVICE_CONFIG_TEST=(nginx -t)

# ログの強制ローテートに使う logrotate 設定ファイル(復旧アクション A4 用)
LOGROTATE_CONF="/etc/logrotate.d/nginx"

# ---------------------------------------------------------------------
# 2. 判定しきい値
# ---------------------------------------------------------------------

# ディスク使用率をチェックするマウントポイント(スペース区切り)
DISK_TARGETS="/ /var"

# ディスク使用率(%)。WARN 以上で警告、CRIT 以上で異常と判定する。
DISK_WARN_PERCENT=80
DISK_CRIT_PERCENT=90

# メモリ使用率(%)。available(すぐに使える量)を除いた割合で判定する。
MEM_WARN_PERCENT=80
MEM_CRIT_PERCENT=90

# ロードアベレージ(1分平均)を「CPUコア1個あたり」に換算した値で判定する。
# 1.0 = コア数と同じ負荷、2.0 = コア数の2倍の負荷。
LOAD_WARN_PER_CORE=1.0
LOAD_CRIT_PER_CORE=2.0

# 直近ログのエラー件数。この件数以上で警告と判定する。
ERROR_COUNT_WARN=5

# journalctl で何分前までのログを見るか
RECENT_ERROR_MINUTES=10

# ログファイルを直接見る場合に、末尾から何行を走査対象にするか
LOG_SCAN_LINES=500

# 診断レポートに載せるログ抜粋の行数
LOG_TAIL_LINES=30

# エラーとみなす文字列(grep -E の正規表現)
ERROR_PATTERN="ERROR|CRIT|EMERG|ALERT|error|emerg"

# journalctl が使えない環境で参照するログファイル(スペース区切り)
ERROR_LOG_FILES="/var/log/nginx/error.log"

# ---------------------------------------------------------------------
# 3. タイムアウト
# ---------------------------------------------------------------------

# 個々の外部コマンドのタイムアウト秒数(timeout コマンドに渡す)
CMD_TIMEOUT=10

# HTTPヘルスチェックのタイムアウト秒数
HTTP_TIMEOUT=5

# 確認プロンプトの入力待ち秒数。時間切れは「実行しない」として扱う。
CONFIRM_TIMEOUT=60

# ---------------------------------------------------------------------
# 4. 出力先
# ---------------------------------------------------------------------

# 監査ログ(誰が・いつ・何をしたかの記録)
AUDIT_LOG="/var/log/runbook-assist/audit.log"

# 診断レポート(1回の診断ごとに1ファイル生成される)の保存先ディレクトリ
DIAG_DIR="/var/log/runbook-assist/diagnosis"

# 状態ファイル置き場(最新の診断結果・ロックファイル)
STATE_DIR="/var/lib/runbook-assist"

# 補足: 診断レポートは実行のたびに1ファイル増える。古いファイルの削除は
# スクリプト側では行わず、OS標準の logrotate に任せる
# (削除処理を自作すると、パスの指定ミスで無関係なファイルを消す事故につながるため)。
# 設定例は src/runbook-assist.logrotate を参照。

# ---------------------------------------------------------------------
# 5. 復旧アクションの許可リスト(ホワイトリスト)
#
# ここに書かれていないアクションIDは、コマンドラインで指定されても
# 実行しない。「実行できる操作の範囲」を設定ファイル側で明示的に
# 絞り込むための仕組み(既定では A1〜A4 のみ)。
#
#   A1 = 設定ファイルの構文チェック(読み取りのみ)
#   A2 = サービスへの設定リロード
#   A3 = サービスの再起動
#   A4 = ログの強制ローテート
#
# 例えば「本番では再起動まで自動化したくない」場合は、
#   ALLOWED_ACTIONS="A1 A2 A4"
# と書き換えるだけで A3 を封じられる。
# ---------------------------------------------------------------------
ALLOWED_ACTIONS="A1 A2 A3 A4"

# 同じアクションを短時間に繰り返していないか監査ログで確認する秒数。
# この秒数以内に同じ操作の実行記録があれば警告を出す
# (再起動を繰り返しても直らない = 別の原因がある、というサインのため)。
RECENT_ACTION_GUARD_SECONDS=600

# ---------------------------------------------------------------------
# 6. 通知(任意)
# ---------------------------------------------------------------------

# 復旧操作を実行したときに Slack へ通知するか(true/false)
ENABLE_SLACK_NOTIFY=false

# Slack Incoming Webhook のURL
# Slack管理画面の [App管理 > Incoming Webhooks] で発行した値に置き換える。
SLACK_WEBHOOK_URL="<YOUR_SLACK_WEBHOOK_URL>"
