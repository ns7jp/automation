# shellcheck shell=bash
# shellcheck disable=SC2034
# (このファイルは変数を定義するだけの設定ファイルであり、実際に使うのは
#  読み込む側のスクリプト。そのため「未使用変数」の警告は無効化している)
# =====================================================================
# inventory.conf
# 改善案件No.6: サーバー台帳の自動収集・差分検知 - 共通設定ファイル
#
# このファイルを編集することで、スクリプト本体のロジックを変更せずに
# 動作を変えられる。「設定(config)」と「処理(script)」を分離しておくと、
# 運用担当者が値を変えるだけで対応でき、誤ってロジックを壊すリスクを
# 減らせる(構築パックの案件No.2 / No.4 と同じ設計方針)。
#
# 【文法メモ】
#   このファイルは各スクリプトから `source`(=中身をその場で読み込んで
#   実行する命令)される。書式はシェルスクリプトと同じで、
#   「変数名=値」の = の前後に空白を入れるとエラーになる。
#
# 注意: このファイルには Slack Webhook の URL(秘匿情報)を書くため、
#       配置後は必ず `chmod 600 inventory.conf` で権限を絞ること。
# =====================================================================

# ---------------------------------------------------------------
# 1. 対象サーバーの定義ファイル
# ---------------------------------------------------------------
# SCRIPT_DIR は読み込む側のスクリプトが設定済みの変数(スクリプトの置き場所)。
TARGETS_FILE="${SCRIPT_DIR}/targets.conf"

# ---------------------------------------------------------------
# 2. データの保存場所
# ---------------------------------------------------------------

# --- スナップショット(日付ごとの構成情報JSON)の保存先 ---
# 実際のファイルは以下のように日付ディレクトリの下に置かれる。
#   ${SNAPSHOT_ROOT}/2026-09-07/web01.json
# 「日付ディレクトリ + ホスト名.json」にしておくと、
# 過去のある日の構成をそのまま取り出せる(=変更履歴になる)。
SNAPSHOT_ROOT="/var/lib/inventory-drift/snapshots"

# --- 生成した台帳・差分レポートの出力先 ---
REPORT_DIR="/opt/inventory-drift/reports"

# --- このツール自身の実行ログ ---
LOG_FILE="/var/log/inventory-drift/inventory-drift.log"

# --- スナップショットの保持日数 ---
# これより古い日付ディレクトリは、収集時に自動削除される。
# 400日にしているのは「前年の同じ月と比較できるように1年+α」という理由。
# 1台あたり数KBのJSONなので、6台×400日でも数十MB程度に収まる。
SNAPSHOT_RETENTION_DAYS=400

# ---------------------------------------------------------------
# 3. SSH接続の設定
# ---------------------------------------------------------------

# --- 収集に使うSSH秘密鍵のパス ---
# この鍵は「収集専用」に作り、対象サーバー側では
# command= オプションで実行できるコマンドを限定しておく(04-build-guide.md参照)。
SSH_KEY="/home/invadmin/.ssh/id_ed25519_inventory"

# --- SSH接続のタイムアウト秒数 ---
# cronでの自動実行では「応答がないサーバーで永久に待ち続ける」ことが
# 最悪の事故になる。必ず短めのタイムアウトを設定する。
SSH_CONNECT_TIMEOUT=10

# --- 1台あたりの収集処理全体のタイムアウト秒数 ---
# 接続はできたが、対象サーバーが高負荷でコマンドが返ってこない場合の保険。
SSH_COMMAND_TIMEOUT=60

# ---------------------------------------------------------------
# 4. 収集する項目のカスタマイズ
# ---------------------------------------------------------------

# --- バージョンを収集する主要パッケージ(空白区切り) ---
# 「全パッケージ」を収集すると1台あたり数千行になり、セキュリティ更新の
# たびに大量の差分が出てノイズになる。監視したいものだけに絞るのが定石。
WATCH_PACKAGES="bash openssh-server nginx cron rsync curl"

# --- ディスク使用状況を収集するマウントポイント(空白区切り) ---
DISK_MOUNTS="/ /var /home"

# ---------------------------------------------------------------
# 5. 差分検知の設定
# ---------------------------------------------------------------

# --- 差分から除外する項目(拡張正規表現) ---
# 「毎回必ず変わる値」を差分として扱うと、毎日必ず通知が飛び、
# 本当に見るべき変更が埋もれてしまう(=オオカミ少年状態)。
# ここに書いたパターンに一致するキーは比較対象から外す。
#   disks[...].used_percent : ディスク使用率は日々変動するため除外
#                             (容量監視は構築パック案件No.4の役割)
#   collected_at            : 収集時刻そのもの
# パイプ "|" でつないで複数指定できる。
DRIFT_IGNORE_PATTERN='^disks\[[^]]*\]\.used_percent=|^collected_at='

# --- 「重要」として扱うキーの正規表現 ---
# ここに一致する差分は、レポート・通知で「要確認」として強調表示される。
# ユーザー・管理者権限・開放ポート・パッケージは、セキュリティに直結するため重要扱い。
DRIFT_CRITICAL_PATTERN='^(users|sudoers|ports|packages)\['

# ---------------------------------------------------------------
# 6. 通知設定
# ---------------------------------------------------------------

# --- Slack通知を使うかどうか(true / false) ---
# 最初は false のまま動作確認し、内容に納得してから true にするとよい。
ENABLE_SLACK_NOTIFY="false"

# --- Slack Incoming Webhook のURL ---
# ※ 実際のURLに置き換えて使うこと。リポジトリにコミットしてはいけない。
SLACK_WEBHOOK_URL="<YOUR_SLACK_WEBHOOK_URL>"

# --- 差分が0件だった日も通知するか(true / false) ---
# false にすると「変更があった日だけ」通知される。
# true にすると「今日も異常なし」が毎日届き、
# 「ツール自体が止まっていないこと」を確認できる(=死活監視を兼ねる)。
NOTIFY_ON_NO_DRIFT="false"

# ---------------------------------------------------------------
# 7. 台帳(レポート)の記載情報
# ---------------------------------------------------------------
# ※ 株式会社サンプル商事は「架空の依頼元」。実在の企業ではない。
COMPANY_NAME="株式会社サンプル商事"
LEDGER_AUTHOR="情報システム課 運用担当"
