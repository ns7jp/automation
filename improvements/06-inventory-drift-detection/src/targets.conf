# =====================================================================
# targets.conf
# 改善案件No.6: サーバー台帳の自動収集・差分検知 - 収集対象サーバー一覧
#
# 収集対象を増やす・減らすときは、このファイルだけを編集すればよい
# (collect_inventory.sh 本体は変更不要)。
#
# 書式(カンマ区切り、4項目):
#   name,transport,address,role
#
#   name      : サーバーを識別する名前。台帳・JSONファイル名に使う
#               (英数字・ハイフン・アンダースコアのみ。空白不可)
#   transport : 接続方法。"ssh" または "local"
#                 ssh   … SSH経由で対象サーバーに接続して収集する(本番運用)
#                 local … このスクリプトを実行しているマシン自身から収集する
#                         (SSH接続先を用意できないときの動作確認用。
#                          後述の「ローカルモード」を参照)
#   address   : transport=ssh   の場合 → SSH接続先(user@host または host)
#               transport=local の場合 → 使わないので "-" を入れる
#   role      : サーバーの役割。台帳の分類欄に出力される(例: web, db, batch)
#
# "#" で始まる行と空行は読み飛ばされる(コメント行として扱われる)。
#
# ---------------------------------------------------------------------
# 【ローカルモードについて】
#   SSH接続できる検証サーバーを用意できない場合でも、transport に "local"
#   を指定すれば、自分のマシン1台を対象にツール全体の動作を確認できる。
#   下の「動作確認用」の行のコメント(#)を外し、本番用の6行をコメントアウト
#   すれば、すぐに試せる。
# ---------------------------------------------------------------------
# =====================================================================

# --- 本番運用時の設定例(管理対象6台) ---
# 株式会社サンプル商事(架空の依頼元)の管理対象サーバー6台。
web01,ssh,invadmin@192.168.1.11,web
web02,ssh,invadmin@192.168.1.12,web
app01,ssh,invadmin@192.168.1.21,app
app02,ssh,invadmin@192.168.1.22,app
db01,ssh,invadmin@192.168.1.31,db
batch01,ssh,invadmin@192.168.1.41,batch

# --- 動作確認用(ローカルモード) ---
# SSHの接続先がまだ用意できていない段階では、以下の1行だけを有効にして
# 上の6行をコメントアウトすると、自分のマシンを対象に一通り動作を試せる。
#localhost,local,-,test
