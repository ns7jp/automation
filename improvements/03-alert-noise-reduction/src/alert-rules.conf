# =====================================================================
# alert-rules.conf
# 改善案件No.3: アラート過多の改善 - 重要度分類ルール定義ファイル
#
# ■ このファイルの役割
#   「どの通知を、どの重要度で、どこへ届けるか」を1行1ルールで定義する。
#   スクリプト本体(alert-router.sh / common.sh)は一切変更せずに、
#   このファイルを編集するだけで分類の方針を変えられる。
#
# ■ 書式(パイプ "|" 区切りの6項目)
#   ルールID|パターン|重要度|通知先|集約ウィンドウ秒|説明
#
#   ルールID  : 一意な識別子。記録・集計・日次サマリで使う(例 R010)
#   パターン  : 通知本文に対する拡張正規表現(ERE)
#   重要度    : P1 / P2 / P3 のいずれか
#   通知先    : critical / daily / record のいずれか
#   集約ウィンドウ秒 : この秒数のあいだの同種通知を1件にまとめる
#                      (P1は集約しないので 0 を入れる)
#   説明      : 人が読むためのメモ。通知本文にもそのまま載る
#
# ■ 重要度の意味(詳細は 03-design.md 3章)
#   P1 = 即時対応。夜間・休日でも起こす。メンション付きで即時通知
#   P2 = 翌営業日対応。集約して別チャンネルへまとめて通知
#   P3 = 記録のみ。即時通知はせず、全件記録+日次サマリで届ける
#
# ■ 通知先の意味
#   critical = P1専用チャンネル(#alert-p1)
#   daily    = まとめ・日次サマリ用チャンネル(#alert-daily)
#   record   = 即時通知なし(記録と日次サマリのみ)
#
# ■ 重要な注意1: 評価は「上から順」で、最初に一致したルールが勝つ
#   したがって「細かい条件のルールを上に、大まかなルールを下に」置く。
#   例: CRITICAL専用ルールを、ERROR全般のルールより上に書く。
#
# ■ 重要な注意2: パターンの中に "|"(OR)は書けない
#   "|" は項目の区切り文字として使っているため、パターン内で使うと
#   列がずれて壊れる。OR条件が必要な場合は次のどちらかで書く。
#     (a) ルールを複数行に分ける(推奨。どのルールに当たったか分かるため)
#     (b) 文字クラス [ ] を使う(例: 8[5-9]% で 85〜89% を表す)
#
# ■ 重要な注意3: どのルールにも一致しない通知は自動的に P1 になる
#   (alert-router.conf の AR_UNMATCHED_SEVERITY)。
#   新種の通知を静かに握りつぶさないための安全装置。
#   「未分類が多い=ルールの整備が足りない」というサインでもある。
# =====================================================================

# ---------------------------------------------------------------------
# 死活監視の通知(projects/04-server-health-check が出力)
#   実際のメッセージ例:
#     :red_circle: [障害検知] web01(http://192.168.1.11/)が2回連続でNGです
#
# 本番系(web/api/db)は即時対応、非本番系(batch/dev/test)は記録のみ。
# 「同じ死活NGでも、対象が本番かどうかで重要度は変わる」という
# 重要度設計の基本を、そのままルールに落とし込んでいる。
# ---------------------------------------------------------------------
R010|\[障害検知\] web|P1|critical|0|本番Webサーバーの死活NG
R011|\[障害検知\] api|P1|critical|0|本番APIサーバーの死活NG
R012|\[障害検知\] db|P1|critical|0|本番DBサーバーの死活NG
R013|\[障害検知\] batch|P3|record|3600|バッチサーバーの死活NG(瞬断が多く単発では対応不要)
R014|\[障害検知\] dev|P3|record|3600|検証サーバーの死活NG
R015|\[障害検知\] test|P3|record|3600|テストサーバーの死活NG
R019|\[障害検知\]|P1|critical|0|未定義ホストの死活NG(フェイルセーフ。上のどれにも当たらない場合)

# ---------------------------------------------------------------------
# 復旧通知(projects/04-server-health-check が出力)
#   実際のメッセージ例:
#     :white_check_mark: [復旧] web01(http://192.168.1.11/)が復旧しました
#
# 復旧通知は単体では対応不要なのでP3。ただし「直前にP1として通知した
# 障害」の復旧だけは、対応中の担当者にとって最重要の情報になるため、
# alert-router.conf の AR_RECOVERY_RULES に登録してP1へ格上げする。
# ---------------------------------------------------------------------
R020|\[復旧\]|P3|record|3600|復旧通知(P1発報中のホストのみP1へ格上げ)

# ---------------------------------------------------------------------
# ログ監視の通知(projects/03-log-monitoring-alert が出力)
#   実際のメッセージ例(複数行。取り込み時に1行へ整形される):
#     :rotating_light: *ログ異常検知* :rotating_light: ホスト: app01 ...
#     検知内容(抜粋): 2026-09-01 09:05:12 ERROR OrderService: ...
#
# CRITICAL を含むものだけをP1、それ以外(ERROR)はP2にしている。
# ERRORは同じ事象で何十件も出るため、10分単位でまとめて1件にする。
# ---------------------------------------------------------------------
R030|ログ異常検知.*CRITICAL|P1|critical|0|アプリログのCRITICAL検知
R031|ログ異常検知|P2|daily|600|アプリログのERROR検知(10分単位でまとめる)

# ---------------------------------------------------------------------
# バックアップジョブの通知(projects/02-backup-automation が出力)
#   実際のメッセージ例:
#     :x: [バックアップ失敗] daily-20260901.tar.gz の作成に失敗しました(終了コード: 2)
#     :warning: [容量警告] バックアップ先(/backup)の使用率が 78% です(閾値: 70%)
#
# 「完了しました」という成功通知は、対応が発生しないためP3。
# 成功を毎回Slackへ流すのは、典型的なアラート疲れの原因のひとつ。
# ---------------------------------------------------------------------
R040|\[バックアップ失敗\]|P1|critical|0|バックアップジョブの失敗(データ保全に直結)
R041|\[バックアップ完了\]|P3|record|3600|バックアップジョブの正常終了(情報通知)

# 容量警告は「何%か」で重要度を分ける。
# 数字の範囲は文字クラス [ ] で表現している(パターン内で "|" が使えないため)。
R042|\[容量警告\].*使用率が 100%|P1|critical|0|ディスク使用率100%(書き込み不能。即時対応)
R043|\[容量警告\].*使用率が 9[0-9]%|P2|daily|3600|ディスク使用率90〜99%(翌営業日に拡張検討)
R044|\[容量警告\].*使用率が 8[5-9]%|P2|daily|3600|ディスク使用率85〜89%(翌営業日に確認)
R049|\[容量警告\]|P3|record|3600|ディスク使用率84%以下(閾値70%が低すぎて常時出ている)

# ---------------------------------------------------------------------
# 証明書期限チェックの通知(既存の運用スクリプトが出力)
#   実際のメッセージ例:
#     :information_source: [証明書] www.example.com の有効期限まで残り 45 日です
#
# 60日前から毎日通知されるため、そのままでは典型的な「慣れる通知」になる。
# 残り日数で重要度を分け、余裕があるうちは日次サマリだけに載せる。
# ---------------------------------------------------------------------
R060|\[証明書\].*残り [0-7] 日|P1|critical|0|証明書の期限が7日以内(サービス停止に直結)
R061|\[証明書\].*残り [0-9] 日|P2|daily|3600|証明書の期限が8〜9日(上のR060で7日以内は除外済み)
R062|\[証明書\].*残り 1[0-4] 日|P2|daily|3600|証明書の期限が10〜14日
R069|\[証明書\]|P3|record|86400|証明書の期限が15日以上(日次サマリで十分)

# ---------------------------------------------------------------------
# 監視ツール自身の通知(systemd の再起動通知など)
#   実際のメッセージ例:
#     :arrows_counterclockwise: [監視] log-watch-alert サービスを再起動しました
#
# 監視の仕組み自体が動いていることの確認は必要だが、1件ずつ人に
# 知らせる必要はない。日次サマリで「今日は何回再起動したか」を見れば足りる。
# ---------------------------------------------------------------------
R070|\[監視\]|P3|record|3600|監視ツール自身の再起動・再接続通知
