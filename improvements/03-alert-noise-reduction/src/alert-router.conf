# =====================================================================
# alert-router.conf
# 改善案件No.3: アラート過多の改善 - 共通設定ファイル
#
# このファイルを書き換えるだけで動作を変えられるようにしてある。
# 「しきい値や通知先を設定ファイルへ外出しする」理由:
#   1. 運用担当者がスクリプト本体(ロジック)を触らずに調整できる
#      → 変更ミスでツールが壊れるリスクが下がる
#   2. どこを変えたかがdiffで一目で分かる(=変更履歴が追える)
#   3. 検証環境と本番環境で「同じスクリプト・違う設定」を使える
#   4. 「なぜこの値なのか」をコメントとして値のすぐ隣に書き残せる
#
# 注意: Webhook URL(秘匿情報)を含むため、配置後は必ず
#       `chmod 600 alert-router.conf` で権限を絞ること。
#
# すべての項目は "${VAR:-既定値}" の形で書いてあるので、
# 環境変数で一時的に上書きできる。例:
#   AR_MODE=active ./alert-router.sh --source ... --message ...
# =====================================================================

# --- 配置ディレクトリ(既定はこの設定ファイルが置かれている場所) ---
AR_BASE_DIR="${AR_BASE_DIR:-${AR_SCRIPT_DIR}}"

# --- ルール定義ファイル(パターン|重要度|通知先 を並べたファイル) ---
AR_RULES_FILE="${AR_RULES_FILE:-${AR_BASE_DIR}/alert-rules.conf}"

# --- 状態ファイルの置き場所(集約ウィンドウ・重複排除・P1発報中フラグ) ---
# /var/lib は「サービスが動作中に書き換える永続データ」を置く標準的な場所。
AR_DATA_DIR="${AR_DATA_DIR:-/var/lib/alert-router}"

# --- ログ・記録の置き場所 ---
AR_LOG_DIR="${AR_LOG_DIR:-/var/log/alert-router}"

# --- 全件記録(JSON Lines)。★ここだけは絶対に間引かない★ ---
# 通知を減らしても、この記録は受け取った通知を1件残らず保持する。
AR_RECORD_FILE="${AR_RECORD_FILE:-${AR_LOG_DIR}/records.jsonl}"

# --- 実行ログ(スクリプト自身の動作ログ) ---
AR_RUN_LOG="${AR_RUN_LOG:-${AR_LOG_DIR}/alert-router.log}"

# --- 送信台帳(何件通知したかを数えるためのファイル) ---
AR_OUTBOX="${AR_OUTBOX:-${AR_LOG_DIR}/outbox.log}"

# --- 日次サマリの出力先ディレクトリ ---
AR_SUMMARY_DIR="${AR_SUMMARY_DIR:-${AR_LOG_DIR}/summary}"

# --- 動作モード ---
#   shadow : 影実行。判定と記録は行うが、通知は従来どおり全件を旧チャンネルへ
#            流す(現場の見え方は変わらない)。段階的移行の第1段階。
#   active : 本稼働。判定結果どおりに P1/P2/P3 を振り分けて通知する。
# 移行が完全に終わるまでは shadow のままにしておくこと。
# 何か問題が起きたときは、この値を shadow に戻すだけで元の状態に戻せる
# (=ロールバック手順。04-build-guide.md のStep 12を参照)。
AR_MODE="${AR_MODE:-shadow}"

# --- 画面出力を抑制するか(true/false) ---
# true にすると INFO/WARN を画面に出さない(ログファイルには残る)。
# 過去ログを一括で流し込む検証時に、画面が流れて見づらくなるのを防ぐ。
AR_QUIET="${AR_QUIET:-false}"

# --- 集約ウィンドウの既定値(秒) ---
# ルール定義ファイルで個別に指定されていない場合に使われる。
# 600秒(10分)は「まとめても対応が遅れて困らない」かつ
# 「まとめすぎて状況が分からなくならない」バランス点として選定。
AR_DEFAULT_WINDOW="${AR_DEFAULT_WINDOW:-600}"

# --- 重複排除の時間(秒) ---
# まったく同じ文面がこの秒数以内に再送された場合、2件目以降は通知しない。
# P1にも適用する唯一の間引き。180秒は「同じ障害の再送」と
# 「別の新しい障害」を取り違えない範囲として設定。
AR_DEDUP_SECONDS="${AR_DEDUP_SECONDS:-180}"

# --- 大量発生エスカレーションの閾値(件) ---
# 1つの集約ウィンドウ内で同種の通知がこの件数に達したら、
# 重要度に関わらずP1チャンネルへ1件だけ先行通知する。
# 「重要度を下げた種別が、実は大きな障害の予兆だった」場合の安全弁。
AR_ESCALATE_COUNT="${AR_ESCALATE_COUNT:-20}"

# --- どのルールにも一致しなかった通知の重要度 ---
# 必ず P1 にしておくこと。未知の通知を静かに握りつぶさないため。
AR_UNMATCHED_SEVERITY="${AR_UNMATCHED_SEVERITY:-P1}"

# --- 復旧通知として扱うルールID(スペース区切りで複数指定可) ---
# ここに挙げたルールの通知は、同じホストがP1発報中なら
# 重要度をP1へ格上げして即時通知する。
AR_RECOVERY_RULES="${AR_RECOVERY_RULES:-R020}"

# --- 「P1発報中」フラグの有効期間(秒) ---
# 復旧通知が来ないまま放置されたフラグを、いつまでも残さないための保険。
AR_P1_ACTIVE_TTL="${AR_P1_ACTIVE_TTL:-86400}"

# --- Slackへ実際に送信するか(true/false) ---
# false のときは送信せず、送信台帳(outbox.log)に書くだけ(ドライラン)。
# 検証や自動テストでは false のまま件数だけ数える。
AR_ENABLE_SLACK="${AR_ENABLE_SLACK:-false}"

# --- 通知先ごとのWebhook URL ---
# critical: P1専用チャンネル(例 #alert-p1)。人数を絞りメンションを飛ばす
# daily   : P2まとめ・日次サマリ用チャンネル(例 #alert-daily)。常時見ない
# legacy  : 移行前から使っている既存チャンネル(例 #monitoring)。影実行で使用
AR_WEBHOOK_CRITICAL="${AR_WEBHOOK_CRITICAL:-<YOUR_SLACK_WEBHOOK_URL>}"
AR_WEBHOOK_DAILY="${AR_WEBHOOK_DAILY:-<YOUR_SLACK_WEBHOOK_URL>}"
AR_WEBHOOK_LEGACY="${AR_WEBHOOK_LEGACY:-<YOUR_SLACK_WEBHOOK_URL>}"

# --- P1通知に付けるメンション文字列 ---
# <!channel> はチャンネル全員へ通知するSlackの記法。
# P1にだけ付けることで「鳴ったら必ず何かある」状態を作る。
# 空文字にすればメンションなしにできる。
AR_MENTION_P1="${AR_MENTION_P1:-<!channel>}"
