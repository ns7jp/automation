# =====================================================================
# health_check.conf
# 案件No.4: サーバー死活監視・障害検知ツール - 共通設定ファイル
#
# このファイルを編集することで、health_check.sh 本体のロジックを
# 変更せずに動作をカスタマイズできる。「設定(config)」と「処理(script)」
# を分離しておくと、運用担当者が値を変えるだけで対応でき、誤って
# ロジックを壊してしまうリスクを減らせる(案件No.2と同じ設計方針)。
#
# 注意: このファイルにはSlack WebhookのURL(秘匿情報)を含むため、
#       配置後は必ず `chmod 600 health_check.conf` でアクセス権限を絞ること。
# =====================================================================

# --- 監視対象サーバーのリストを定義したファイル ---
# health_check.sh と同じディレクトリに配置する前提(SCRIPT_DIRは本体側で設定済み)
TARGETS_FILE="${SCRIPT_DIR}/targets.conf"

# --- 状態ファイル(各サーバーの連続失敗回数・通知済みフラグを保持) ---
STATE_FILE="/var/lib/server-health-check/state.csv"

# --- 全チェック履歴(稼働率集計に使用する) ---
HISTORY_FILE="/var/log/server-health-check/history.csv"

# --- 実行ログの出力先 ---
LOG_FILE="/var/log/server-health-check/health_check.log"

# --- 自動生成するMarkdownレポートの出力先 ---
REPORT_FILE="/opt/server-health-check/report/report.md"

# --- 異常とみなす連続NG回数(閾値) ---
# 1回だけの失敗(瞬間的な通信断など)で誤って通知してしまう
# "誤検知(フラッピング)" を避けるため、既定では2回に設定している。
FAIL_THRESHOLD=2

# --- ping監視のオプション ---
# PING_COUNT  : 1回のチェックで何回パケットを送るか
# PING_TIMEOUT: 応答を待つ秒数(iputils-ping の -W オプションに渡す)
PING_COUNT=3
PING_TIMEOUT=2

# --- HTTP監視のタイムアウト(秒) ---
HTTP_TIMEOUT=5

# --- 稼働率(直近何時間の成功率を計算するか) ---
UPTIME_WINDOW_HOURS=24

# --- Slack通知を有効にするか(true/false) ---
ENABLE_SLACK_NOTIFY=true

# --- Slack Incoming WebhookのURL ---
# Slack側の「Appを追加」>「Incoming Webhooks」で発行したURLに書き換える
# 例: <YOUR_SLACK_WEBHOOK_URL>
SLACK_WEBHOOK_URL="<YOUR_SLACK_WEBHOOK_URL>"
