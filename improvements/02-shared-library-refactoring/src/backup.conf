# =====================================================================
# backup.conf
# 案件No.2: 定期バックアップ自動化&世代管理ツール - 設定ファイル
#
# このファイルを編集することで、backup.sh 本体のロジックを変更せずに
# 動作をカスタマイズできる。「設定(config)」と「処理(script)」を
# 分離しておくと、運用担当者が値を変えるだけで対応でき、
# 誤ってロジックを壊してしまうリスクを減らせる。
#
# 注意: このファイルにはSlack WebhookのURL(秘匿情報)を含むため、
#       配置後は必ず `chmod 600 backup.conf` でアクセス権限を絞ること。
# =====================================================================

# --- バックアップ対象ディレクトリ ---
# 例: 運用中のWebサーバーのコンテンツ格納先
BACKUP_SRC_DIR="/var/www/html"

# --- バックアップの保存先ディレクトリ ---
# tar.gz形式のバックアップファイルはここに蓄積される
BACKUP_DEST_DIR="/var/backups/html-backup"

# --- ログファイルの出力先 ---
LOG_FILE="/var/log/backup-automation/backup.log"

# --- 世代管理:バックアップを何日分残すか ---
# 7 = 直近7日分。8日以上前のバックアップは自動削除される
RETENTION_DAYS=7

# --- 空き容量チェックの警告閾値(%) ---
# バックアップ先ディレクトリが存在するディスクの使用率がこの値以上に
# なった場合、WARNログとSlack通知を出す
DISK_USAGE_THRESHOLD=80

# --- Slack通知を有効にするか(true/false) ---
ENABLE_SLACK_NOTIFY=true

# --- Slack Incoming WebhookのURL ---
# Slack側の「Appを追加」>「Incoming Webhooks」で発行したURLに書き換える
# 例: <YOUR_SLACK_WEBHOOK_URL>
SLACK_WEBHOOK_URL="<YOUR_SLACK_WEBHOOK_URL>"
