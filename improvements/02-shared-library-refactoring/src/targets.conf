# =====================================================================
# targets.conf
# 案件No.4: サーバー死活監視・障害検知ツール - 監視対象サーバーリスト
#
# 監視したいサーバーを増やしたい・減らしたいときは、このファイルだけを
# 編集すればよい(health_check.sh 本体は変更不要)。
# 設定(このファイル)と処理(health_check.sh)を分離しておくことで、
# 運用担当者がロジックを壊さずに対象サーバーを変更できるようにしている。
#
# 書式(カンマ区切り、4項目):
#   name,type,target,option
#
#   name   : サーバーを識別する名前。レポートやログの表示に使う(空白不可)
#   type   : 監視方法。"ping" または "http" のいずれか
#   target : type=ping の場合 → 監視対象のIPアドレスまたはホスト名
#            type=http の場合 → 監視対象のURL(http:// または https://)
#   option : type=http の場合 → 正常とみなすHTTPステータスコード(例: 200)
#            type=ping の場合 → 使用しないので "-" を入れておく(空欄でも動くが
#                                 列の意味を分かりやすくするため明示している)
#
# "#" で始まる行と空行は読み飛ばされる(コメント行として扱われる)。
# =====================================================================

# --- Webサーバー群(HTTPステータスコードで監視) ---
web01,http,http://192.168.1.11/,200
web02,http,https://192.168.1.12/,200
api01,http,http://192.168.1.13:8080/healthz,200

# --- DB・アプリケーションサーバー群(pingで監視) ---
# HTTPサービスを持たないサーバーは ping で「ネットワーク的に生きているか」だけを見る
db01,ping,192.168.1.21,-
app01,ping,192.168.1.22,-
