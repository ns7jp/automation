---
# =====================================================================
# site.yml
# ex18: Playbookを完成させる(解答例)
#
# 解答例は「1つの正解」ではありません。仕様を満たしていれば、
# コメントの書き方やタスクの細かい引数は自由です。
# ただしここで使っている書き方(FQCNでのモジュール指定、mode のクォート、
# notify と handlers の対応)は実務でも定番なので、意味を理解したうえで
# 真似することを勧めます。
#
# 実サーバーに適用するときの流れ(この演習では実行しません):
#   ansible-playbook -i inventory/hosts.ini site.yml --syntax-check
#       → YAMLとPlaybookの書式だけを検査する。何も変更しない
#   ansible-playbook -i inventory/hosts.ini site.yml --check --diff
#       → ドライラン。何が変わるかだけを表示し、実際には変更しない
#   ansible-playbook -i inventory/hosts.ini site.yml
#       → 本適用
# =====================================================================

# Playbook の一番外側は「play(プレイ)のリスト」。
# 「- 」で始まっているのは、この play がリストの1要素だから。
# play が2つ以上あるときは、同じ深さに「- name: ...」を並べていく。
- name: Webサーバーの初期設定

  # hosts: この play をどのサーバーに適用するか。
  #   インベントリ(対象サーバーの一覧ファイル)に書いたグループ名を指定する。
  #   ここを間違えると、意図しないサーバーに設定を流し込むことになるため、
  #   実務では本番適用の前に必ず --check で対象を確認する。
  hosts: webservers

  # become: true は「各タスクを管理者権限(sudo)で実行する」という指定。
  #   パッケージのインストールや /etc 以下への書き込みには root 権限が要る。
  #   逆に、権限が要らない play では書かないほうが安全。
  become: true

  # vars: この play の中だけで使える変数をまとめて定義する場所。
  #   値を1か所に集めておくと、あとで変えたい場所が1つで済む。
  #   ここで定義した nginx_port は、配布するテンプレート(nginx.conf.j2)の中で
  #   {{ nginx_port }} と書いて使うことを想定している。
  vars:
    nginx_port: 80

  # tasks: 上から順に1つずつ実行される作業のリスト。
  #   1つのタスクは「- name: 説明」「使うモジュール」「モジュールの引数」の3段で書く。
  tasks:
    #---------------------------------------------------------------
    # タスク1: パッケージのインストール
    #---------------------------------------------------------------
    - name: nginx をインストールする
      # ansible.builtin.apt は Debian/Ubuntu 系のパッケージ管理モジュール。
      # 「ansible.builtin.」から始まる正式名称(FQCN)で書くのが現在の推奨。
      # 短く apt: と書いても動くが、同名モジュールとの衝突を避けるため
      # 案件のコードでもFQCNで統一している。
      ansible.builtin.apt:
        name: nginx
        # state: present は「入っている状態にする」という意味。
        # 「インストールしろ」という命令ではなく「あるべき状態」を書くのが
        # Ansibleの考え方。すでに入っていれば何もしない(ok)。
        state: present
        # update_cache: true は apt update 相当の処理。
        # パッケージ一覧が古いままだとインストールに失敗することがあるため、
        # 先に一覧を更新しておく。
        update_cache: true

    #---------------------------------------------------------------
    # タスク2: 設定ファイルの配置
    #---------------------------------------------------------------
    - name: 設定ファイルを配置する
      # ansible.builtin.template は「テンプレートを変数で埋めてから配る」モジュール。
      # src は手元(コントロールノード)のテンプレート、dest は配布先のパス。
      ansible.builtin.template:
        src: nginx.conf.j2
        dest: /etc/nginx/nginx.conf
        owner: root
        group: root
        # mode は必ずクォートで囲む。囲まないとYAMLが 0644 を
        # 「10進数の644」として読み込み、意図しない権限になってしまう。
        # 数字で始まる値を書くときはクォート、と覚えてしまってよい。
        mode: "0644"
      # notify は、このタスクが changed になったときだけ
      # 指定した名前のハンドラを「予約」する仕組み。
      # 予約されたハンドラは play の全タスクが終わったあとに1回だけ動く。
      # 設定ファイルを10か所直しても、再起動は1回で済む。
      # ここに書く文字列は、handlers の name と一字一句同じにする必要がある。
      notify: nginx を再起動する

    #---------------------------------------------------------------
    # タスク3: サービスの起動と自動起動の有効化
    #---------------------------------------------------------------
    - name: nginx を起動し自動起動を有効にする
      ansible.builtin.service:
        name: nginx
        # state: started は「今動いている状態にする」。
        # すでに動いていれば何もしないので、restarted と違って
        # 実行のたびにサービスが止まることがない。
        state: started
        # enabled: true は「サーバーを再起動しても自動で立ち上がる」設定。
        # started だけでは、OS再起動後に止まったままになる。
        enabled: true

  # -------------------------------------------------------------------
  # handlers: 「変更があったときだけ動く後処理」を書く場所。
  #   書き方はタスクとまったく同じだが、notify で名前を呼ばれない限り動かない。
  #   設定ファイルが変わっていないのに毎回サービスを再起動すると、
  #   そのたびに一瞬アクセスできない時間が生まれる。それを避けるための仕組み。
  # -------------------------------------------------------------------
  handlers:
    - name: nginx を再起動する
      ansible.builtin.service:
        name: nginx
        state: restarted
