# =====================================================================
# deploy.yml
# ex20: GitHub Actionsワークフローを書く(解答例)
#
# 解答例は「1つの正解」ではありません。仕様を満たしていれば書き方は自由です。
# ただし、ここで使っている書き方(トリガーの並べ方、needs と if の組み合わせ、
# Secrets の参照)は実務のワークフローでも定番なので、意味を理解したうえで
# 真似することを勧めます。
#
# 置き場所:
#   本番のリポジトリでは .github/workflows/deploy.yml に置く。
#   GitHub は「.github/workflows/ の中のYAMLファイル」だけをワークフローとして
#   読み込む。1文字でもパスが違うと、何も起きない(エラーも出ない)。
# =====================================================================

# ワークフローの名前。GitHubのActionsタブに、この名前で一覧表示される。
name: deploy

# ---------------------------------------------------------------------
# on: いつこのワークフローを動かすか(トリガー)
#
#   push          : ブランチにコミットが push されたとき
#   pull_request  : そのブランチ宛てのプルリクエストが作られた・更新されたとき
#   workflow_dispatch : GitHubの画面から手動で実行できるようにする
#
#   push と pull_request の両方を書いている理由:
#     プルリクエストの時点でテストを流しておけば、mainに取り込む前に
#     壊れていることに気づける。「壊れたものをmainに入れない」ための入口。
#
#   workflow_dispatch は値を書かなくてよいので、キーとコロンだけを書く。
# ---------------------------------------------------------------------
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# ---------------------------------------------------------------------
# jobs: 実行する仕事の集まり
#
#   ジョブは既定では「同時に」動く。順番を付けたいときだけ needs を使う。
#   ジョブごとに、まっさらな仮想マシン(ランナー)が用意される。
#   つまり test ジョブで作ったファイルは deploy ジョブには残らない。
#   だから deploy ジョブでも改めて checkout している。
# ---------------------------------------------------------------------
jobs:

  # -------------------------------------------------------------------
  # test ジョブ(CI: 継続的インテグレーション)
  #   push でも pull_request でも必ず動く。ここが失敗したら deploy は動かない。
  # -------------------------------------------------------------------
  test:
    # runs-on: どのOSのランナーを借りるか。ubuntu-latest が最も一般的。
    runs-on: ubuntu-latest
    steps:
      # uses: 誰かが公開した既製の部品(Action)を呼び出す。
      #   actions/checkout はリポジトリの中身をランナーへ持ってくる公式Action。
      #   @v4 はバージョン指定。付けないと将来勝手に挙動が変わる危険がある。
      - uses: actions/checkout@v4

      # run: ランナーの上でシェルコマンドをそのまま実行する。
      #   run で実行したコマンドの終了ステータスが0以外になると、
      #   そのステップは失敗し、ジョブ全体も失敗になる。
      #   「テストが落ちたらデプロイしない」という仕組みは、この
      #   終了ステータスだけで成り立っている。
      - name: shellcheck で静的解析する
        run: shellcheck scripts/*.sh

      - name: テストを実行する
        run: bash scripts/test.sh

  # -------------------------------------------------------------------
  # deploy ジョブ(CD: 継続的デリバリー)
  #   test が成功し、かつ main ブランチのときだけ動く。
  # -------------------------------------------------------------------
  deploy:
    # needs: 先に成功していなければならないジョブを指定する。
    #   test が失敗すると、この deploy ジョブは実行されずスキップされる。
    needs: test

    # if: 条件を満たすときだけジョブを動かす。
    #   github.ref には「今動いているブランチの正式名」が入る。
    #   main ブランチなら refs/heads/main という文字列になる。
    #   これが無いと、プルリクエストのたびに本番へ配布されてしまう。
    if: github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # -------------------------------------------------------------
      # SSH秘密鍵の配置
      #
      #   ${{ secrets.名前 }} は「GitHubに登録しておいた秘密の値」を
      #   実行時にはめ込むための書き方。ファイルには名前しか残らない。
      #
      #   chmod 600 は「持ち主だけが読み書きできる」権限にする指定。
      #   SSHは、他人にも読める権限の秘密鍵を渡されると、安全のために
      #   接続を拒否する。ここを忘れると必ず接続に失敗する。
      # -------------------------------------------------------------
      - name: SSH秘密鍵を配置する
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      # -------------------------------------------------------------
      # rsync による配布
      #
      #   rsync は「差分だけを転送するコピーコマンド」。
      #     -a  権限や更新日時を保ったままコピーする
      #     -v  何を転送したか表示する
      #     -z  転送中に圧縮する
      #     --delete  配布元に無いファイルは配布先からも消す
      #
      #   接続先のユーザー名とホスト名も Secrets から受け取る。
      #   サーバーのホスト名は、攻撃者にとっては立派な手がかりになるため、
      #   公開リポジトリに書かないほうがよい。
      # -------------------------------------------------------------
      - name: rsync で配布する
        run: |
          rsync -avz --delete \
            -e "ssh -o StrictHostKeyChecking=no" \
            app/ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/var/www/html/"
