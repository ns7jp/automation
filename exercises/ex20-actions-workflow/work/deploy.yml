#
# YAMLの書式ルール(YAMLは「見た目」がそのまま意味になる言語です)
#   - インデントは半角スペース2つ。タブは絶対に使えない
#   - 行頭の「- 」はリストの1要素という意味
#   - 「キー: 値」のコロンの後ろには半角スペースを1つ入れる
#   - # で始まる行はコメント
#   - 記号はすべて半角。全角のコロンやスペースが混ざると読み込めない
#
# 書き終えたら、まず次のコマンドでYAMLとして読めるか確かめると早いです。
#   python3 -c 'import yaml,sys; yaml.safe_load(open(sys.argv[1]))' \
#     ex20-actions-workflow/work/deploy.yml
# =====================================================================

