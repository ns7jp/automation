---
# =====================================================================
# tasks.yml
# ex19: べき等なタスクに書き換える(解答例)
#
# 解答例は「1つの正解」ではありません。仕様を満たしていれば、
# コメントや採点対象外の引数は自由です。
# ただし「shell / command をやめて専用モジュールを使う」という方針そのものは、
# Ansibleを使ううえで最も大事な習慣なので必ず身につけてください。
#
# べき等性(idempotency)とは:
#   同じ処理を何度実行しても、結果が同じ1つの状態に落ち着く性質のこと。
#   Ansibleの専用モジュールは、実行前に「今どうなっているか」を確認し、
#   すでに望みの状態なら何もしない(ok)。違うときだけ変更する(changed)。
#   そのため、2回目以降の実行は changed=0 になるのが正常な姿。
#
# 確認方法(この演習では実行しません):
#   ansible-playbook site.yml        # 1回目: changed が出る
#   ansible-playbook site.yml        # 2回目: changed=0 になれば、べき等に書けている
# =====================================================================

#-----------------------------------------------------------------------
# 書き換え前: ansible.builtin.shell: useradd -m webadmin
#   何が悪いか: useradd はユーザーが既にいると失敗する。しかもAnsibleから見ると
#   「コマンドを実行した」以上のことは分からないため、毎回 changed 扱いになる。
#-----------------------------------------------------------------------
- name: ユーザーを作成する
  ansible.builtin.user:
    name: webadmin
    shell: /bin/bash
    # create_home: true でホームディレクトリを作る。useradd -m に相当する。
    create_home: true
    # state: present は「存在する状態にする」。既にいれば何もしない。
    # 消したいときは state: absent に変えるだけでよい。
    state: present

#-----------------------------------------------------------------------
# 書き換え前: ansible.builtin.shell: mkdir -p /opt/app
#   何が悪いか: mkdir -p は2回目もエラーにならないが、権限や所有者を指定できず、
#   Ansibleから見ると毎回 changed になる。file モジュールなら所有者と権限まで
#   「あるべき状態」として宣言でき、ずれていれば直してくれる。
#-----------------------------------------------------------------------
- name: アプリ用ディレクトリを作成する
  ansible.builtin.file:
    path: /opt/app
    # state: directory は「ディレクトリとして存在する状態にする」。
    # mkdir -p と同じく、途中のディレクトリもまとめて作ってくれる。
    state: directory
    owner: root
    group: root
    # mode は必ずクォートで囲む。YAMLは先頭が 0 の数値を8進数として読むため
    # 0755 と書けば偶然うまくいくが、先頭の 0 を落として 755 と書くと
    # 10進数の755(8進数では1363)として解釈され、まったく別の権限になる。
    # 文字列として渡してしまえば、この取り違えは起きない。
    mode: "0755"

#-----------------------------------------------------------------------
# 書き換え前: ansible.builtin.shell: echo "PermitRootLogin no" >> /etc/ssh/sshd_config
#   何が悪いか: >> は追記なので、2回実行すると同じ行が2つ並ぶ。
#   設定ファイルがどんどん汚れ、最後にはどれが効いているのか分からなくなる。
#-----------------------------------------------------------------------
- name: SSHの設定を追記する
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    # regexp に一致する行があれば line で置き換え、無ければ末尾に追記する。
    # ^#?PermitRootLogin は「行頭が PermitRootLogin、または #PermitRootLogin」の意味。
    # コメントアウトされた初期設定も拾えるように #? を付けている。
    regexp: "^#?PermitRootLogin"
    line: "PermitRootLogin no"
    # state: present は「この行がある状態にする」。何度実行しても行は1つのまま。
    state: present

#-----------------------------------------------------------------------
# 書き換え前: ansible.builtin.command: systemctl start nginx
#   何が悪いか: 起動中でも毎回 changed になる。さらに「自動起動を有効にする」
#   (systemctl enable)を別のタスクで書く必要があり、書き忘れの原因になる。
#-----------------------------------------------------------------------
- name: nginx を起動する
  ansible.builtin.service:
    name: nginx
    # state: started は「今動いている状態にする」。既に動いていれば何もしない。
    state: started
    # enabled: true は「サーバー再起動後も自動で立ち上がる状態にする」。
    # 1つのタスクで起動と自動起動をまとめて宣言できる。
    enabled: true

#-----------------------------------------------------------------------
# 書き換え前: ansible.builtin.shell: apt-get install -y curl
#   何が悪いか: 毎回 apt-get が走るので実行が遅く、毎回 changed になる。
#   さらに、確認なしで進める -y のようなオプションを自分で管理する必要がある。
#-----------------------------------------------------------------------
- name: curl をインストールする
  ansible.builtin.apt:
    name: curl
    # state: present は「入っている状態にする」。既に入っていれば何もしない。
    # なお state: latest にすると毎回最新版へ更新しようとするため、
    # 「いつの間にかバージョンが上がっていた」という事故につながる。
    # バージョンを固定したい本番環境では present を使うのが基本。
    state: present
