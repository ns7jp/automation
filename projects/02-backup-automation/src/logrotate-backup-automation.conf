# =====================================================================
# logrotate-backup-automation.conf
# 案件No.2: 定期バックアップ自動化&世代管理ツール - ログローテーション設定
#
# 配置場所: /etc/logrotate.d/backup-automation
# (logrotateは/etc/logrotate.dディレクトリ配下の設定ファイルを
#  自動的に読み込む。ファイル名は任意だが拡張子は付けない慣習がある)
#
# backup.sh は実行するたびに backup.log へ追記し続けるため、
# 対策をしないとログファイルが際限なく肥大化してしまう。
# この設定で「30日分だけ残し、それより古い分は圧縮・削除する」
# というルールを適用する。
# =====================================================================

/var/log/backup-automation/backup.log {
    # daily        : 日次でローテーション対象かどうかを判定する
    daily

    # rotate 30    : 過去30世代分のログファイルを保持する
    rotate 30

    # compress     : ローテーションしたログをgzip圧縮し容量を節約する
    compress

    # delaycompress: 直前の1世代は圧縮せず残す(直近ログを調査しやすくするため)
    delaycompress

    # missingok    : 対象ログファイルが存在しなくてもエラーにしない
    missingok

    # notifempty   : ログが空の場合はローテーションしない(空ファイルの山を防ぐ)
    notifempty

    # copytruncate : ログファイルをコピーしたあと元ファイルを空にする方式。
    #                backup.shはファイルディスクリプタを保持し続けない
    #                (実行のたびに追記モードで開く)シンプルなスクリプトのため、
    #                プロセス再起動なしでも安全にローテーションできるこの方式を採用する
    copytruncate
}
