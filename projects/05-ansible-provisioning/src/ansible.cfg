# ansible.cfg
# Ansibleの動作設定ファイル。ansible-playbookコマンドを実行するディレクトリに
# このファイルを置いておくと、Ansibleが自動的に読み込んでくれる。
#
# 「毎回 -i inventory/hosts.ini を打つのが面倒」「接続設定を使い回したい」
# といった理由から、実務ではほぼ必ずこのファイルを用意する。

[defaults]
# Inventory(接続先の一覧)のデフォルトパス。
# これを指定しておけば、以後 `ansible-playbook site.yml` のように
# -i オプションを省略して実行できる。
inventory = inventory/hosts.ini

# Role(roles/配下のディレクトリ)を探しに行く場所。
roles_path = roles

# SSHの初回接続時に聞かれる
# 「The authenticity of host 'xxx' can't be established. Are you sure you want to continue connecting (yes/no)?」
# という確認を自動化(スキップ)するかどうか。
# 検証用のまっさらなサーバーは頻繁に作り直すため True(=無効化)にしているが、
# 本番運用ではセキュリティ上 False にして known_hosts で正しく管理するのが望ましい。
# (詳細は 05-troubleshooting.md Q3を参照)
host_key_checking = False

# 実行失敗時に生成される *.retry ファイルを作らない設定。
# 昔のAnsibleではデフォルトで有効だったが、現在はあまり使われないため無効化しておく。
retry_files_enabled = False

# 実行結果の表示形式をYAML風に整形する。標準のままでも動作に支障はないが、
# 初心者にとっては構造が見やすくなるためこちらを採用している。
stdout_callback = yaml

[privilege_escalation]
# become = True にしておくと、Playbook側で毎回 become: true を書かなくても
# root権限が必要な処理(パッケージインストール等)を sudo 経由で実行できる。
# ※ 今回は各Playbook/Role側でも明示的に become: true を書いており、
#   ここでの指定は「デフォルトの安全策」としての位置づけ。
become = True
become_method = sudo
become_ask_pass = False
