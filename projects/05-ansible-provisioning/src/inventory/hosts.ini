# inventory/hosts.ini
# Ansibleが「どのサーバーに対して」処理を行うかを定義するファイル(Inventory)。
# ここに書いたホストだけが、Playbookの対象になる。
#
# 192.0.2.0/24 はRFC 5737で「ドキュメント・検証用」として予約されている
# アドレス帯(実在の機器には割り当てられない)。本書ではサンプルとして使用しているので、
# 実際に構築する際は各自の検証環境(VagrantのIPやクラウドVMのグローバル/プライベートIP)に
# 書き換えること。

# [グループ名]
# グループ名でホストをまとめておくと、Playbook側で「hosts: webservers」のように
# グループ単位で対象を指定できる。1台ずつ書く必要がないので保守しやすい。
[webservers]
web01 ansible_host=192.0.2.10
web02 ansible_host=192.0.2.11

# [グループ名:vars] は、そのグループに属する全ホストに共通で使う接続変数。
[webservers:vars]
# 初回構築時の接続ユーザー。
# 検証環境(Vagrant等)ではrootでのSSH鍵ログインが有効な状態を初期状態として
# 想定している。実際のクラウドVM(AWS/GCP/Azure等)では初期ユーザーが
# ubuntu や ec2-user になっていることが多いので、その場合はここを書き換え、
# 併せて become(sudoへの昇格)を有効にすること。
ansible_user=root

# 上記ユーザーで接続する際に使う秘密鍵のパス。
# パスワード認証は使わず、必ず鍵認証で接続する(要件: パスワード認証無効化の前提)。
ansible_ssh_private_key_file=~/.ssh/id_ed25519_bootstrap

# 管理対象サーバー側のPythonインタプリタの場所を明示しておく設定。
# Ansibleは対象サーバー上でPythonスクリプト(モジュール)を実行して処理を行うため、
# Pythonが必須になる。最小構成のイメージだとパスの自動検出に失敗することがあるため、
# 明示しておくと安定する。
ansible_python_interpreter=/usr/bin/python3
